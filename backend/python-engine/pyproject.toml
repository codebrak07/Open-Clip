[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclip-engine"
version = "1.0.0"
description = "OpenClip AI Python Media Engine & Intelligent Video Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
ai = [
    "faster-whisper>=1.0.0",
    "scenedetect[opencv]>=0.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
openclip = "openclip_engine.cli.main:app"
